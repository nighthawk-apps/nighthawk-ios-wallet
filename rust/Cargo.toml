[workspace]
members = ["darkfi-android-bridge", "darkfi-mobile-ffi"]
resolver = "2"

[patch.crates-io]
halo2_proofs = { git = "https://github.com/parazyd/halo2", branch = "v050" }
halo2_gadgets = { git = "https://github.com/parazyd/halo2", branch = "v050" }
url = { git = "https://github.com/darkrenaissance/rust-url", branch = "v258" }
# Keep one form_urlencoded: the url fork's copy, so serde_urlencoded (reqwest,
# pulled in by nym) agrees with url::form_urlencoded.
form_urlencoded = { git = "https://github.com/darkrenaissance/rust-url", branch = "v258" }
# crates.io nym-smolmix stops at 1.21.6. develop is nym-smolmix 2.0.0.
# The 1.22.2 mixnet tag depends on yanked tokio_with_wasm 0.10.1 and cannot
# be freshly resolved. Pin nym develop (2026-11-09) so the mixnet client
# matches the live network. sqlx 0.9 coexists with rusqlite 0.37.
nym-smolmix = { git = "https://github.com/nymtech/nym.git", rev = "72ac24482441b433680eabbb8b373389813cca6d" }

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
