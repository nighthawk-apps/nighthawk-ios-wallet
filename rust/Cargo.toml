[workspace]
members = ["darkfi-android-bridge", "darkfi-mobile-ffi"]
resolver = "2"

[patch.crates-io]
halo2_proofs = { git = "https://github.com/parazyd/halo2", branch = "v050" }
halo2_gadgets = { git = "https://github.com/parazyd/halo2", branch = "v050" }
url = { git = "https://github.com/darkrenaissance/rust-url", branch = "v258" }
# Keep one form_urlencoded: the url fork's copy, so serde_urlencoded (reqwest,
# pulled in by nym) agrees with url::form_urlencoded.
form_urlencoded = { git = "https://github.com/darkrenaissance/rust-url", branch = "v258" }
# crates.io nym-smolmix stops at 1.21.6. Same rev as the Android wallet.
# Pin choice (Android + iOS lockstep): 5f0dba82 (nym-smolmix 2.0.0 on nym develop).
# Do not advance one platform without the other.
nym-smolmix = { git = "https://github.com/nymtech/nym.git", rev = "5f0dba82d7a4c3d32fb21f78a0e3ddb6320b4ae8" }
# Tracked iOS build fix for sysinfo 0.38.4 (open_files + RTM_IFINFO2). Do not
# mutate the crates.io cache under .cargo-home — use this vendor copy instead.
sysinfo = { path = "vendor/sysinfo-0.38.4" }

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
