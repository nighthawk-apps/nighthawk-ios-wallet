input_dir: Sources/Generated/Resources/
output_dir: Sources/Generated/

xcassets:
  inputs:
    - Assets.xcassets
    - Colors.xcassets
  outputs:
      templatePath: Templates/xcassets/assets_swift5_swiftui.stencil
      params:
        forceProvidesNamespaces: true
        publicAccess: true
      output: XCAssets+Generated.swift
      
fonts:
  inputs:
    - Fonts/Zboto.otf
    - Fonts/Rubik
    - Fonts/Roboto
    - Fonts/PulpDisplay
    # outfit.ttf, source_sans_3.ttf, source_serif_4.ttf, and ibm_plex_mono.ttf
    # are registered from Fonts+Generated.swift. Do not regenerate that file
    # without keeping PulpDisplay on Outfit and Rubik/Roboto text styles on
    # Source Sans 3.
  outputs:
      templatePath: Templates/fonts/fonts_swift5_swiftui.stencil
      params:
        publicAccess: true
      output: Fonts+Generated.swift

strings:
  inputs: en.lproj/Localizable.strings
  outputs:
    - templateName: structured-swift5
      params:
        publicAccess: true
      output: L10n.swift
