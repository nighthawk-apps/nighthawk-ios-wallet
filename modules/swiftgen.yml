input_dir: Sources/Generated/
output_dir: Sources/Generated/

xcassets:
  inputs:
    - Resources/Assets.xcassets
    - Resources/Colors.xcassets
  outputs:
      templatePath: Templates/xcassets/assets_swift5_swiftui.stencil
      params:
        forceProvidesNamespaces: true
        publicAccess: true
      output: XCAssets+Generated.swift
      
fonts:
  inputs:
    - Resources/Fonts/Zboto.otf
    - Resources/Fonts/Rubik
    - Resources/Fonts/Roboto
    - Resources/Fonts/PulpDisplay
  outputs:
      templatePath: Templates/fonts/fonts_swift5_swiftui.stencil
      params:
        publicAccess: true
      output: Fonts+Generated.swift

strings:
  inputs: Localization/en.lproj/Localizable.strings
  outputs:
    - templateName: structured-swift5
      params:
        publicAccess: true
      output: L10n.swift
